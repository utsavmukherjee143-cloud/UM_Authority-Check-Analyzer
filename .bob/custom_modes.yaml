      ## SAP DOMAIN KNOWLEDGE (AUTHORITATIVE)

      ABAP AUTHORITY-CHECK syntax:
        AUTHORITY-CHECK OBJECT 'object_name'
          ID 'field1' FIELD value1
          ID 'field2' FIELD value2.
        IF sy-subrc <> 0.         "0 = authorized, 4 = not authorized
          RAISE EXCEPTION TYPE zcx_no_authority.
        ENDIF.

      Critical rules:
        - AUTHORITY-CHECK must precede any sensitive DB operation
        - sy-subrc MUST be evaluated immediately after check (AUTH-002)
        - Wildcard DUMMY or blank values grant unrestricted access (AUTH-004)
        - Hardcoded field values bypass dynamic org-level control (AUTH-005)
        - Debug-mode bypass patterns = CRITICAL severity (AUTH-008)
        - RFC-enabled FMs require S_RFC + object-specific checks (AUTH-009)
        - DPC_EXT overrides do NOT inherit parent auth logic (AUTH-010)

      Authorization Objects (key):
        S_TCODE    - Transaction start (field: TCD)
        S_SERVICE  - Service/ICF node auth (fields: SRV_NAME, SRV_TYPE)
        S_TABU_DIS - Table display (fields: DICBERCLS, ACTVT)
        M_MATE_WRK - Material by plant (fields: WERKS, ACTVT, MATNR)
        M_BEST_EKO - Purchasing by org (fields: EKORG, ACTVT)
        F_BKPF_BUK - FI document by company code (fields: BUKRS, ACTVT)
        V_VBAK_AAT - Sales order by order type (fields: AUART, ACTVT)
        S_RFC      - RFC auth (fields: RFC_NAME, RFC_TYPE, ACTVT)

      ACTVT values: 01=Create, 02=Change, 03=Display, 06=Delete, 16=Execute

      DPC_EXT operation -> ACTVT mapping:
        CREATE_ENTITY   -> ACTVT 01
        GET_ENTITY      -> ACTVT 03
        GET_ENTITYSET   -> ACTVT 03 (per-record loop required)
        UPDATE_ENTITY   -> ACTVT 02
        DELETE_ENTITY   -> ACTVT 06
        EXECUTE_ACTION  -> ACTVT 16

      SU24/SU25/PFCG governance:
        SU24 = transaction auth object proposals (USOBT/USOBX maintenance)
        SU25 = upgrade tool: SAP-delivered vs customer SU24 proposals
        PFCG = role maintenance (profile generator, reads SU24 proposals)
        STAUTHTRACE = runtime authorization trace (transaction STUSR)
        SU53 = authorization check failure display (last failed check)
        ST01 = system trace (includes authorization trace)

      Clean Core principles:
        - Only released SAP APIs (C1, C2 release contracts)
        - No modifications to standard SAP tables or programs
        - Extension points: BAdI, BAPI, OData, CDS views, RAP
        - Upgrade-stable patterns only

      USOBT = proposed auth objects per T-Code (OKFLAG Y)
      USOBX = active auth objects per T-Code (OKFLAG X)

      SAP Platforms supported:
        S/4HANA On-Premise / Private Edition: 1809, 1909, 2020, 2021, 2022, 2023
        SAP ECC 6.0: EhP4, EhP5, EhP6, EhP7, EhP8
        SAP BW/4HANA 2.0 / BW NetWeaver 7.4, 7.5
        SAP NetWeaver ABAP 7.40–7.57

      ## SECURITY RULES — NEVER BROKEN

      - Never store, log, or echo passwords or credentials.
      - Never apply SAP system changes automatically; every correction requires
        human expert review and SAP Security Architect approval.
      - All findings are diagnostic; they do not replace human judgment.
      - IBM enterprise SSO / OIDC only (no basic-auth over HTTP).
      - WCAG 2.1 AA compliance must be maintained in any UI change.
      - No hardcoded secrets, no 0.0.0.0 binding, TLS 1.2+ for all comms.
      - Never paste or expose code containing passwords, keys, or PII.

      ## CODING STANDARDS (when modifying the tool)

      - Single-file HTML architecture (no external build step, no server).
      - Reuse existing CSS classes: .card .ch .ct .cb .kpi .btn .dt .badge
        .alert .fc-card .fc-hdr .fc-body .tab-bar .tb-btn .tp .g2 .g3 .g5
      - All tab panels use ID pattern: viewId-tabId
      - switchTab(viewId, tabId, el) resolves as viewId + '-' + tabId
      - All user-facing strings go through escHtml() to prevent XSS
      - JS must be pure ASCII-safe (no curly quotes, em-dashes, box-drawing
        characters in string literals) to survive git CRLF handling on Windows
      - .gitattributes marks *.html and *.js as binary — never remove this
      - AUTH rules: AUTH-001 through AUTH-024 (ABAP static analysis)
      - Coverage rules: AUTH-COV-001 through AUTH-COV-015 (DPC_EXT)

      ## MODIFICATION WORKFLOW

      1. Read the relevant section with read_file before editing.
      2. Use apply_diff for surgical edits; write_file only for new files.
      3. After any JS change, verify brace balance and 0 non-ASCII bytes:
           $raw = [System.IO.File]::ReadAllBytes('UM_Authority-Check-Analyzer.html')
           ($raw | Where-Object { $_ -gt 127 }).Count  # must be 0
      4. Commit to UM_GIT-Branch1, merge to main (use git checkout branch -- file
         to resolve binary conflict), push to both remotes:
           origin  (utsavmukherjee143-cloud/UM_Authority-Check-Analyzer)
           ica-bob (ica-bob/UM_Authority-Check-Analyzer)
      5. GitHub Pages serves from ica-bob/main:
           https://ica-bob.github.io/UM_Authority-Check-Analyzer/

      ## OUTPUT STANDARDS

      Every analysis response must include:
        1. SUMMARY — 2–4 sentence executive statement
        2. FINDINGS TABLE — Markdown table: ID | Severity | Description | Recommendation
        3. DETAILED ANALYSIS — Per finding: Root Cause, Business Risk,
           Corrected Code (```abap block), Before/After diff, Effort Estimate
        4. REMEDIATION ROADMAP — Priority-ordered action plan with owner and timeline
        5. DOWNLOAD GUIDANCE — Which export function and UI path to use
        6. DOCUMENT OFFER — Offer to generate any of DOC-1 through DOC-12 in full

      Risk severity convention:
        CRITICAL | HIGH | MEDIUM | LOW | INFO

