# ─────────────────────────────────────────────────────────────────────────────
#  UM_Authority-Check-Analyzer — Production nginx configuration
#  HTTPS-only, security headers, gzip, static asset caching
# ─────────────────────────────────────────────────────────────────────────────

# Run as non-root inside the container (UID 1001 set in Dockerfile)
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging (no sensitive data) ──────────────────────────────────────────
    log_format main '$remote_addr - $request_method "$uri" '
                    '$status $body_bytes_sent "$http_referer"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;     # Do not reveal nginx version

    # ── Gzip compression ────────────────────────────────────────────────────
    gzip on;
    gzip_types text/css application/javascript application/json
               image/svg+xml font/woff2;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # ── Redirect all HTTP → HTTPS ────────────────────────────────────────────
    server {
        listen      8080;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS server ─────────────────────────────────────────────────────────
    server {
        listen      8443 ssl;
        server_name _;

        # TLS — certificates are mounted at runtime (see docker-compose.yml)
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # TLS hardening (TLS 1.2 minimum as required by IBM security policy)
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       10m;
        ssl_session_tickets       off;

        # ── Root ──────────────────────────────────────────────────────────────
        root  /usr/share/nginx/html;
        index index.html;

        # ── Security headers ─────────────────────────────────────────────────
        # Strict Transport Security — 1 year, include subdomains
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Prevent clickjacking
        add_header X-Frame-Options "DENY" always;

        # Block MIME-type sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # XSS protection (legacy browsers)
        add_header X-XSS-Protection "1; mode=block" always;

        # Referrer policy — no referrer leaked to third parties
        add_header Referrer-Policy "no-referrer" always;

        # Permissions policy — disable all sensitive browser APIs
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

        # Content Security Policy
        # - default-src 'self'          : only same-origin by default
        # - script-src 'self' 'unsafe-inline' : inline JS required (no build step)
        # - style-src 'self' 'unsafe-inline' https://fonts.googleapis.com
        # - font-src 'self' https://fonts.gstatic.com data:
        # - img-src 'self' data:        : data URIs for inline images
        # - connect-src 'self'          : no external XHR/fetch
        # - frame-ancestors 'none'      : no embedding
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # ── Static file caching ──────────────────────────────────────────────
        location ~* \.(html)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires 0;
        }

        location ~* \.(css|js|woff2|woff|ttf|ico|svg|png|jpg|jpeg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
        }

        # ── Main entry point ─────────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Block hidden files (.git, .env, etc.) ────────────────────────────
        location ~ /\. {
            deny all;
            return 404;
        }

        # ── Custom error pages ───────────────────────────────────────────────
        error_page 404 /index.html;
        error_page 500 502 503 504 /index.html;
    }
}
